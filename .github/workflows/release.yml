name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, such as v1.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Prepare public manufacturer registry
        run: python3 scripts/update-vendors.py
      - name: Run synthetic-data tests
        run: swift test
      - name: Build and verify universal download
        run: zsh scripts/package-release.sh "${RELEASE_TAG#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          archive="build/releases/AirScope-${RELEASE_TAG#v}-macOS-universal.zip"
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > build/release-is-draft.txt; then
            if [[ "$(cat build/release-is-draft.txt)" == false ]]; then
              echo "Release $RELEASE_TAG is already published; keeping its existing assets."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" "$archive" build/releases/SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --draft=false --title "AirScope $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" "$archive" build/releases/SHA256SUMS.txt \
              --verify-tag --title "AirScope $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          fi
